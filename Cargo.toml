[package]
name = "chud-money"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
# Generator syntax for the SSE export in controllers::data and the windowed
# query loop behind it: nested awaits plus terminal events, which
# `futures_util::stream::try_unfold` can only express as a hand-rolled state
# machine.
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3.34"
jsonschema = { version = "0.54", default-features = false }
# Same features as verys-rs-client so only one copy is built.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
mongodb = "3.9"
questdb-rs = "7.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
# Only to pick the process-wide crypto provider in main: both `ring` (mongodb,
# reqwest) and `aws-lc-rs` (reqwest via verys-rs-client, jsonwebtoken) end up
# in the graph, and rustls panics on the first handshake unless one is chosen.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
verys-rs-client = "0.1.0"

[dev-dependencies]
# Throwaway Ed25519 keys for token-verification tests; already in the
# dependency graph as jsonwebtoken's backend.
aws-lc-rs = "1"
tower = { version = "0.5", features = ["util"] }
