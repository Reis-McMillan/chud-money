name: Test, Build & Deploy

on:
  push:
    branches: [main]

# Serialize this repo's deploys; a newer push waits for the running one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # mode=max also caches the builder stage, which holds the slow
          # dependency compile keyed on Cargo.lock.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Reis-McMillan
          repositories: deploy

      - name: Clone deploy repo
        run: |
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/Reis-McMillan/deploy.git deploy

      - name: Update deployment timestamp
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -i
            '.spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt" = now'
            deploy/base/chud-money/chud-money-backend-deployment.yaml

      - name: Commit and push
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/chud-money/chud-money-backend-deployment.yaml
          git commit -m "redeploy chud-money backend (${{ github.sha }})"
          # The client repo's deploy job may push to the deploy repo at the
          # same moment; rebase our one-line commit on top and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase -X theirs
            sleep $((attempt * 2))
          done
          echo "giving up after 5 attempts" >&2
          exit 1
