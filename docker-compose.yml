services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  questdb:
    image: questdb/questdb:10.0.1
    ports:
      - "9000:9000"   # HTTP: ILP ingestion, REST /exec, web console
      - "8812:8812"   # PGWire
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
    volumes:
      - questdb-data:/var/lib/questdb

volumes:
  mongo-data:
  questdb-data:
